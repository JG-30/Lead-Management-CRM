version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: leadflow-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: leadflow
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: leadflow-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/leadflow
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      CORS_ORIGIN: http://localhost
    ports:
      - '5000:5000'

  frontend:
    build: ./frontend
    container_name: leadflow-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  mongo_data:
